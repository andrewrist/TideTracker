# /etc/apache2/sites-available/pi-sensor-server.conf
#
# Apache 2.4 + mod_wsgi VirtualHost for pi-sensor-server.
#
# Required modules (enabled by install.sh):
#   wsgi    headers   rewrite   ssl
#
# After dropping this in:
#   sudo a2ensite pi-sensor-server
#   sudo apachectl -t                                  # syntax check
#   sudo systemctl reload apache2
#   sudo certbot --apache -d sensors.example.com       # adds TLS block
#
# Once certbot runs, it appends an SSL VirtualHost (or rewrites this one) and
# adds a redirect from port 80 to 443. You can replace 'sensors.example.com'
# with your real hostname before running certbot.

<VirtualHost *:80>
    ServerName sensors.example.com
    ServerAdmin admin@example.com

    # --- WSGI ----------------------------------------------------------------
    # Daemon mode so Apache runs the Python interpreter as a dedicated user
    # in its own process group (better isolation + clean restarts).
    WSGIDaemonProcess pi-sensor-server \
        user=sensor-server group=sensor-server \
        processes=2 threads=4 \
        python-home=/opt/pi-sensor-server/venv \
        home=/opt/pi-sensor-server

    WSGIProcessGroup  pi-sensor-server
    WSGIScriptAlias / /opt/pi-sensor-server/app.wsgi

    # mod_wsgi strips the Authorization header by default. The Pi clients
    # send Authorization: Bearer <token>, so we must pass it through.
    WSGIPassAuthorization On

    <Directory /opt/pi-sensor-server>
        <Files app.wsgi>
            Require all granted
        </Files>
    </Directory>

    # --- Hardening / hygiene -------------------------------------------------
    # Cap request body size; a single reading is < 2 KB.
    LimitRequestBody 16384

    # Optional: simple in-process throttle. Tighter, per-IP rate-limiting
    # needs mod_ratelimit or mod_qos. Pi clients post once per minute so
    # this is mostly a safety net.
    # <Location /api/readings>
    #     SetEnvIf Request_Method "POST" is_post
    #     # mod_ratelimit shapes bandwidth, not request count, so it's not
    #     # the right tool. mod_evasive is a simple choice:
    #     #   sudo apt install libapache2-mod-evasive
    #     #   sudo a2enmod evasive
    # </Location>

    # Standard security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"

    # --- Logging -------------------------------------------------------------
    ErrorLog  ${APACHE_LOG_DIR}/pi-sensor-server-error.log
    CustomLog ${APACHE_LOG_DIR}/pi-sensor-server-access.log combined
    LogLevel  warn

    # certbot --apache will append an HTTPS <VirtualHost *:443> below this
    # and a 'RewriteRule ^ https://...' here once a cert is issued.
</VirtualHost>

# ----------------------------------------------------------------------------
# After running `certbot --apache`, your file will end up looking roughly
# like this. The SSL block is shown here for reference if you'd rather
# install certificates manually instead of using certbot.
# ----------------------------------------------------------------------------
#
# <VirtualHost *:443>
#     ServerName sensors.example.com
#     ServerAdmin admin@example.com
#
#     WSGIDaemonProcess pi-sensor-server-ssl \
#         user=sensor-server group=sensor-server processes=2 threads=4 \
#         python-home=/opt/pi-sensor-server/venv \
#         home=/opt/pi-sensor-server
#     WSGIProcessGroup  pi-sensor-server-ssl
#     WSGIScriptAlias / /opt/pi-sensor-server/app.wsgi
#     WSGIPassAuthorization On
#
#     <Directory /opt/pi-sensor-server>
#         <Files app.wsgi>
#             Require all granted
#         </Files>
#     </Directory>
#
#     LimitRequestBody 16384
#
#     Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
#     Header always set X-Content-Type-Options "nosniff"
#     Header always set X-Frame-Options "DENY"
#     Header always set Referrer-Policy "no-referrer"
#
#     SSLEngine on
#     SSLCertificateFile      /etc/letsencrypt/live/sensors.example.com/fullchain.pem
#     SSLCertificateKeyFile   /etc/letsencrypt/live/sensors.example.com/privkey.pem
#     Include /etc/letsencrypt/options-ssl-apache.conf
#
#     ErrorLog  ${APACHE_LOG_DIR}/pi-sensor-server-error.log
#     CustomLog ${APACHE_LOG_DIR}/pi-sensor-server-access.log combined
# </VirtualHost>
